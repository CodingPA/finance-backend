# Replace api.example.com below with your API's real hostname. This file
# only -- if the server also hosts other sites, never edit their existing
# server blocks from here. Copy to
# /etc/nginx/sites-available/<your-hostname>, symlink into sites-enabled/,
# `nginx -t`, then reload -- see docs/deployment.md.
#
# Certbot (certbot --nginx -d <your-hostname>) will rewrite this file to
# add the SSL server block and the HTTP->HTTPS redirect automatically the
# first time it runs -- don't hand-write the SSL directives, let certbot
# manage them so renewal keeps working.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 20M;

    location /static/ {
        alias /home/deployer/finance-backend/staticfiles/;
    }

    # WebSocket path (docs/websockets.md) -- Upgrade/Connection headers are
    # what let this same location block handle both plain HTTP and the
    # ws:// upgrade; Uvicorn's own --workers processes share WebSocket
    # group state via the Redis-backed channel layer (CHANNEL_LAYERS in
    # core/settings.py), so it's safe for nginx to load-balance across them.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # long-lived WebSocket connections
    }
}
